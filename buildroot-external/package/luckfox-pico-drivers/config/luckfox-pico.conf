# Luckfox Pico Configuration for RaspberryMatic
# Based on LuckfoxTECH SDK v1.4

# Board identification
BOARD_NAME="Luckfox Pico"
BOARD_VENDOR="LuckfoxTECH"
BOARD_SDK_VERSION="1.4"
BOARD_SDK_URL="https://github.com/LuckfoxTECH/luckfox-pico"

# Hardware detection
BOARD_DETECTION=true
BOARD_AUTO_CONFIG=true

# Supported board variants
SUPPORTED_BOARDS="rv1103-pico,rv1103-pico-mini,rv1103-pico-plus,rv1103-pico-webbee,rv1106-pico-ultra,rv1106-pico-ultra-w,rv1106-pico-pro-max"

# Hardware features
ENABLE_CAMERA=true
ENABLE_NPU=true
ENABLE_GPIO=true
ENABLE_I2C=true
ENABLE_SPI=true
ENABLE_USB=true
ENABLE_NETWORK=true
ENABLE_AUDIO=true
ENABLE_STORAGE=true

# Camera/ISP settings
CAMERA_DRIVERS="rockchip_isp,rockchip_isp1,ov5640,ov2640,gc2145,imx219"
CAMERA_RESOLUTIONS="1920x1080,1280x720,640x480"
CAMERA_FPS=30
CAMERA_ISP_ENABLE=true
CAMERA_ISP_STABILIZATION=true
CAMERA_ISP_AUTO_FOCUS=true

# NPU settings (RV1106 only)
NPU_DRIVERS="rockchip_npu,rknpu"
NPU_FREQUENCY="800MHz"
NPU_MEMORY="512MB"
NPU_SUPPORTED_MODELS="yolo,ssd,mobilenet,resnet"
NPU_MODEL_PATH="/opt/luckfox-pico/models"

# GPIO configuration
GPIO_BASE=0
GPIO_COUNT=40
GPIO_EXPORT_AUTO=true
GPIO_PERMISSIONS="666"

# I2C configuration
I2C_BUSES="0,1,2"
I2C_SPEED="400kHz"
I2C_PERMISSIONS="666"

# SPI configuration
SPI_BUSES="0,1"
SPI_SPEED="50MHz"
SPI_PERMISSIONS="666"

# Storage configuration
STORAGE_TYPES="sd_card,emmc,spi_nand"
STORAGE_AUTO_DETECT=true
STORAGE_MOUNT_AUTO=true

# Network configuration
NETWORK_WIFI=true
NETWORK_ETHERNET=true
NETWORK_BLUETOOTH=true
NETWORK_AUTO_CONFIG=true

# USB configuration
USB_SUPPORT=true
USB_STORAGE=true
USB_NETWORK=true
USB_PERMISSIONS="666"

# Audio configuration
AUDIO_DRIVERS="snd_soc_rockchip,snd_soc_rockchip_max98090"
AUDIO_CARD="rockchip"
AUDIO_PERMISSIONS="666"

# Boot configuration
BOOT_MEDIA_AUTO_DETECT=true
BOOT_FALLBACK=true
BOOT_TIMEOUT=3

# Performance settings
PERFORMANCE_GOVERNOR="performance"
CPU_FREQUENCY_MAX="1200MHz"
THERMAL_PROTECTION=true

# Logging configuration
LOG_LEVEL="info"
LOG_ROTATION=true
LOG_MAX_SIZE="10MB"
LOG_MAX_FILES=5

# Debug settings
DEBUG_MODE=false
DEBUG_DRIVERS=false
DEBUG_PERFORMANCE=false

# HomeMatic integration
HOMEMATIC_ENABLE=true
HOMEMATIC_CAMERA_INTEGRATION=true
HOMEMATIC_AI_INTEGRATION=true
HOMEMATIC_GPIO_INTEGRATION=true

# System services
SERVICES_ENABLE=true
SERVICES_AUTO_START=true
SERVICES_LOG_TO_JOURNAL=true

# Security settings
SECURITY_DEVICE_PERMISSIONS=true
SECURITY_USER_GROUPS=true
SECURITY_ACCESS_CONTROL=true

# Update settings
UPDATE_CHECK_ENABLE=true
UPDATE_AUTO_DOWNLOAD=false
UPDATE_SIGNATURE_VERIFY=true

# Monitoring settings
MONITORING_ENABLE=true
MONITORING_TEMPERATURE=true
MONITORING_PERFORMANCE=true
MONITORING_STORAGE=true
MONITORING_NETWORK=true
